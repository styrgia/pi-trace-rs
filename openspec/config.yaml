schema: spec-driven

context: |
  Language: English
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Pi Trace is an MIT-licensed local trace explorer for Pi coding agents.
  Rust owns import, correlation, timing and usage semantics; the browser owns presentation.
  Initial compatibility targets the events.jsonl format in docs/upstream-compatibility.md.
  Pi extensions run in JavaScript or TypeScript. Rust initially imports existing traces.
  Raw traces can contain secrets. Use synthetic fixtures and never commit real traces.
  The repository currently contains a runnable development scaffold, not a trace analyzer.

rules:
  specs:
    - Distinguish recorded timings, derived intervals and unknown measurements.
    - Specify malformed and incomplete input behavior and avoid double-counting usage.
  tasks:
    - Mark only verified implementation complete; keep planned product work unchecked.
