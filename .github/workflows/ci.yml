name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust
        run: cargo test --workspace --locked
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Check Svelte and TypeScript
        run: npm --prefix web run check
      - name: Build web app
        run: npm --prefix web run build
      - name: Audit web dependencies
        run: npm --prefix web audit --audit-level=high
      - name: Validate OpenSpec
        run: npx --yes --package @fission-ai/openspec@1.15.0 openspec validate --all --strict --no-interactive
